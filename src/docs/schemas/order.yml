UpdateOrder:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - pending
        - processing
        - shipped
        - delivered
        - cancelled
      example: processing
      
UpdateItemQuantity:
  type: object
  required:
    - quantity
  properties:
    quantity:
      type: integer
      minimum: 1
      example: 10
