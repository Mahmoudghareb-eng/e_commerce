register:
  post:
    operationId: registerUser
    summary: Register a new user
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yml#/Register"
    responses:
      "201":
        description: User registered successfully
      "400":
        description: Email already exists
      "429":
        $ref: "../responses/common.yml#/TooManyRequest"
      "500":
        $ref: "../responses/common.yml#/ServerError"

login:
  post:
    operationId: loginUser
    summary: Login user
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yml#/Login"
    responses:
      "200":
        description: Login successful
      "401":
        $ref: "../responses/common.yml#/Unauthorized"
      "429":
        $ref: "../responses/common.yml#/TooManyRequest"
      "500":
        $ref: "../responses/common.yml#/ServerError"

refresh:
  post:
    operationId: refreshAccessToken
    summary: Generate a new access token using refresh token
    description: Uses the refresh token stored in an HttpOnly cookie.
    tags: [Authentication]
    security:
    - refreshCookie: []
    responses:
      "200":
        description: Access token refreshed successfully
      "401":
        $ref: "../responses/common.yml#/Unauthorized"
      "404":
        description: Refresh token not found
      "429":
        $ref: "../responses/common.yml#/TooManyRequest"
      "500":
        $ref: "../responses/common.yml#/ServerError"

forgotpassword:
  post:
    operationId: forgotPassword
    summary: Request password reset
    description: Send a password reset code to the user's email.
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yml#/ForgetPassword"
    responses:
      "200":
        description: Password reset code sent successfully
      "401":
        $ref: "../responses/common.yml#/Unauthorized"
      "404":
        description: User not found
      "500":
        $ref: "../responses/common.yml#/ServerError"

resetpassword:
  post:
    operationId: resetPassword
    summary: Reset password
    description: Reset user password using the reset code.
    tags: [Authentication]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yml#/ResetPassword"
    responses:
      "200":
        description: Password reset successfully
      "400":
        description: Invalid or expired reset code
      "401":
        $ref: "../responses/common.yml#/Unauthorized"
      "429":
        $ref: "../responses/common.yml#/TooManyRequest"
      "500":
        $ref: "../responses/common.yml#/ServerError"

logout:
  post:
    operationId: logoutUser
    summary: Logout user
    description: Revokes the refresh token and clears the HttpOnly cookie.
    tags: [Authentication]
    security:
    - refreshCookie: []
    responses:
      "200":
        description: User logged out successfully
      "401":
        $ref: "../responses/common.yml#/Unauthorized"
      "429":
        $ref: "../responses/common.yml#/TooManyRequest"
      "500":
        $ref: "../responses/common.yml#/ServerError"

me:
  get:
    operationId: getCurrentUser
    summary: Get current user
    tags: [Users]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Current user data
      "401":
        $ref: "../responses/common.yml#/Unauthorized"
      "404":
        description: User not found
      "500":
        $ref: "../responses/common.yml#/ServerError"

  put:
    operationId: updateCurrentUser
    summary: Update current user
    tags: [Users]
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yml#/UpdateMe"
    responses:
      "200":
        description: Profile updated
      "401":
        $ref: "../responses/common.yml#/Unauthorized"
      "404":
        description: User not found
      "500":
        $ref: "../responses/common.yml#/ServerError"

  delete:
    operationId: deleteCurrentUser
    summary: Delete current user
    tags: [Users]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: User deleted
      "401":
        $ref: "../responses/common.yml#/Unauthorized"
      "404":
        description: User not found
      "500":
        $ref: "../responses/common.yml#/ServerError"
