openapi: 3.0.1
info:
  title: E_Commerce API/v1
  version: 1.0.0
  description: Test Express API/v1 with autogenerated swagger doc

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Register:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Mahmoud
        email:
          type: string
          format: email
          example: mahmoud@example.com
        password:
          type: string
          example: Password123

    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: mahmoud@example.com
        password:
          type: string
          example: Password123

    ForgetPassword:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: mahmoud@example.com

    ResetPassword:
      type: object
      required:
        - email
        - code
        - password
      properties:
        email:
          type: string
          format: email
          example: mahmoud@example.com
        code:
          type: number
          format: integer
          example: 123456
        password:
          type: string
          example: Password123          

    UpdateMe:
      type: object
      properties:
        name:
          type: string
          example: Mahmoud Gharib
        email:
          type: string
          format: email
          example: mahmoud@example.com

    AddProduct:
      type: object
      required:
        - name
        - description
        - price
        - quantity
      properties:
        name:
          type: string
          example: iPhone 15
        description:
          type: string
          example: Apple smartphone
        price:
          type: number
          format: float
          example: 999.99
        quantity:
          type: integer
          example: 10
        image_url:
          type: string

    UpdateProduct:
      type: object
      properties:
        name:
          type: string
          example: iPhone 15 Pro
        description:
          type: string
          example: Updated description
        price:
          type: number
          format: float
          example: 1099.99
        quantity:
          type: integer
          example: 20

    UpdateOrder:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - processing
            - shipped
            - delivered
            - cancelled
          example: processing

    UpdateItemQuantity:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 10

    AddItemToCart:
      type: object
      description: Request body for adding a product to the shopping cart.
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 10

    CreateCoupon:
      type: object
      required:
        - code
        - discount_percent
      properties:
        code:
          type: string
          description: Unique coupon code
          example: ABC12
        discount_percent:
          type: integer
          minimum: 1
          maximum: 100
          description: Discount percentage
          example: 10
        expires_at:
          type: string
          format: date-time
          description: Coupon expiration date
          example: "2026-12-31T23:59:59Z"

    Checkout:
      type: object
      properties:
        code:
          type: string
          description: Unique coupon code
          example: ABC12

  parameters:
    ProductId:
      in: path
      name: id
      required: true
      description: Product ID
      schema:
        type: integer

    OrderId:
      in: path
      name: id
      required: true
      description: Order ID
      schema:
        type: integer

    OrderItemOrderId:
      in: path
      name: order_id
      required: true
      description: Order ID
      schema:
        type: integer

    ItemId:
      in: path
      name: id
      required: true
      description: item ID
      schema:
        type: integer

    CouponCode:
      in: path
      name: code
      required: true
      description: Coupon code
      schema:
        type: string

    Search:
      in: query
      name: search
      description: Search by product name
      schema:
        type: string

    Page:
      in: query
      name: page
      schema:
        type: integer
        example: 1

    Limit:
      in: query
      name: limit
      schema:
        type: integer
        example: 10

    MinPrice:
      in: query
      name: minPrice
      schema:
        type: number
        example: 100

    MaxPrice:
      in: query
      name: maxPrice
      schema:
        type: number
        example: 1000

    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum:
          - asc
          - desc

paths:
  /api/v1/users/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Email already exists
        "429":
          description: Too many requests
        "500":
          description: Server error

  /api/v1/users/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid email or password
        "429":
          description: Too many requests
        "500":
          description: Server error

  /api/v1/users/refresh:
    post:
      summary: Generate a new access token using refresh token
      description: Uses the refresh token stored in an HttpOnly cookie.
      tags:
        - Authentication
      responses:
        "200":
          description: Access token refreshed successfully
        "401":
          description: Invalid or expired refresh token
        "404":
          description: Refresh token not found
        "429":
          description: Too many requests
        "500":
          description: Server error
  
  /api/v1/users/forgotpassword:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send a password reset code to the user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetPassword'
      responses:
        '200':
          description: Password reset code sent successfully
        '401':
          description: Invalid email
        '404':
          description: User not found
        "500":
          description: Server error

  /api/v1/users/resetpassword:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset user password using the reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
      responses:
        '200':
          description: Password reset successfully
        '401':
          description: Invalid code or email or code expired
        '400':
          description: Invalid or expired reset code
        '429':
          description: Too many attempts. Please request a new code
        "500":
          description: Server error

  /api/v1/users/logout:
    post:
      summary: Logout user
      description: Revokes the refresh token and clears the HttpOnly cookie.
      tags:
        - Authentication
      responses:
        "200":
          description: User logged out successfully
        "401":
          description: Invalid or missing refresh token
        "429":
          description: Too many requests
        "500":
          description: Server error

  /api/v1/users/me:
    get:
      summary: Get current user
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user data
        "401":
          description: Unauthorized
        "404":
          description: User not found
        "500":
          description: Server error

    put:
      summary: Update current user
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMe"
      responses:
        "200":
          description: Profile updated
        "401":
          description: Unauthorized
        "404":
          description: User not found
        "500":
          description: Server error

    delete:
      summary: Delete current user
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User deleted
        "401":
          description: Unauthorized
        "404":
          description: User not found
        "500":
          description: Server error

  /api/v1/products:
    post:
      summary: Create a new product
      tags:
        - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProduct"
      responses:
        "201":
          description: Product created successfully
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "500":
          description: Server error

    get:
      summary: Get all products
      tags:
        - Products
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Products fetched successfully
        "400":
          description: Validation error
        "500":
          description: Server error

  /api/v1/products/{id}:
    get:
      summary: Get product by ID
      tags:
        - Products
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product fetched successfully
        "404":
          description: Product not found
        "500":
          description: Server error

    put:
      summary: Update product
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProduct"
      responses:
        "200":
          description: Product updated successfully
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "404":
          description: Product not found
        "500":
          description: Server error

    delete:
      summary: Delete product
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product deleted successfully
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "404":
          description: Product not found
        "500":
          description: Server error

  /api/v1/orders/myorders:
    get:
      summary: Get my orders
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders fetched successfully
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /api/v1/orders/{id}:
    get:
      summary: Get order by ID
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order fetched successfully
        "400":
          description: Validation error
        "403":
          description: Not allowed
        "404":
          description: Order not found
        "500":
          description: Server error

    put:
      summary: Update order by ID
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrder"
      responses:
        "200":
          description: Order updated successfully
        "400":
          description: Validation error
        "403":
          description: Admin only
        "404":
          description: Order not found
        "500":
          description: Server error

    delete:
      summary: Delete order by ID
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order deleted successfully
        "400":
          description: Validation error
        "403":
          description: Not allowed
        "404":
          description: Order not found
        "500":
          description: Server error

  /api/v1/orders/{id}/cancel:
    patch:
      summary: Cancel order by ID
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order cancelled successfully
        "400":
          description: Validation error
        "403":
          description: Not allowed
        "404":
          description: Order not found
        "500":
          description: Server error

  /api/v1/orders/items/order/{order_id}:
    get:
      summary: Get all items for a specific order
      tags:
        - Order Items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderItemOrderId"
      responses:
        "200":
          description: Order items fetched successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order not found
        "500":
          description: Server error

  /api/v1/orders/items/{id}:
    get:
      summary: Get order item by ID
      tags:
        - Order Items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Order items fetched successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order item not found
        "500":
          description: Server error

    put:
      summary: Update order item quantity
      tags:
        - Order Items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemQuantity"
      responses:
        "200":
          description: Order items updated successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order item not found
        "500":
          description: Server error

    delete:
      summary: Delete order item
      tags:
        - Order Items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Order item deleted successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order item not found
        "500":
          description: Server error

  /api/v1/cart:
    post:
      summary: Create a new cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        "201":
          description: cart created successfully
        "401":
          description: Unauthorized
        "400":
          description: Cart already exists
        "500":
          description: Server error

    get:
      summary: Get current user's cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: cart fetched successfully
        "401":
          description: Unauthorized
        "404":
          description: Cart not found
        "500":
          description: Server error

    delete:
      summary: Clear all items from the cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: cart cleared successfully
        "401":
          description: Unauthorized
        "404":
          description: Cart not found
        "500":
          description: Server error

  /api/v1/cart/delete:
    delete:
      summary: Delete the current user's cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: cart deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Cart not found
        "500":
          description: Server error

  /api/v1/cart/items:
    post:
      summary: Add a product to the current user's cart
      tags:
        - Cart Items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddItemToCart"
      responses:
        "201":
          description: Item added successfully
        "400":
          description: Validation error or insufficient stock
        "401":
          description: Unauthorized
        "404":
          description: Product or cart not found
        "500":
          description: Server error

    get:
      summary: Get all items in the current user's cart
      tags:
        - Cart Items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart items fetched successfully
        "401":
          description: Unauthorized
        "404":
          description: Cart not found
        "500":
          description: Server err

  /api/v1/cart/items/{id}:
    put:
      summary: Update cart item quantity
      tags:
        - Cart Items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemQuantity"
      responses:
        "200":
          description: Cart item updated successfully
        "400":
          description: Validation error or insufficient stock
        "401":
          description: Unauthorized
        "403":
          description: Not allowed
        "404":
          description: Cart item or product not found
        "500":
          description: Server error

    delete:
      summary: Remove an item from the current user's cart
      tags:
        - Cart Items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Cart item removed successfully
        "401":
          description: Unauthorized
        "403":
          description: Not allowed
        "404":
          description: Cart item not found
        "500":
          description: Server error

  /api/v1/coupons:
    post:
      summary: Create a new coupon
      tags:
        - Coupons
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCoupon"
      responses:
        "201":
          description: Coupon created successfully
        "400":
          description: Validation error or Coupon already exists
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (Admin access required)
        "500":
          description: Server error

  /api/v1/coupons/{code}:
    get:
      summary: Get coupon by code
      description: Retrieve coupon details using its unique code.
      tags:
        - Coupons
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CouponCode"
      responses:
        "200":
          description: Coupon fetched successfully
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (Admin access required)
        "404":
          description: Coupon not found
        "500":
          description: Server error

    delete:
      summary: Delete coupon by code
      tags:
        - Coupons
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CouponCode"
      responses:
        "200":
          description: Coupon deleted successfully
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (Admin access required)
        "404":
          description: Coupon not found
        "500":
          description: Server error

  /api/v1/checkout:
    post:
      summary: Create a new order from the current user's cart
      description: Creates an order from the authenticated user's cart and optionally applies a coupon.
      tags:
        - Checkout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Checkout"
      responses:
        "201":
          description: Order created successfully
        "400":
          description: Invalid request (empty cart, invalid or expired coupon, or insufficient stock)
        "401":
          description: Unauthorized
        "404":
          description: Cart or product not found
        "500":
          description: Server error