openapi: 3.0.1
info:
  title: E_Commerce API/v1
  version: 1.0.0
  description: Test Express API/v1 with autogenerated swagger doc

servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    Register:
      $ref: "./schemas/user.yml#/Register"
    Login:
      $ref: "./schemas/user.yml#/Login"
    ForgetPassword:
      $ref: "./schemas/user.yml#/ForgetPassword"
    ResetPassword:
      $ref: "./schemas/user.yml#/ResetPassword"
    UpdateMe:
      $ref: "./schemas/user.yml#/UpdateMe"

    AddProduct:
      $ref: "./schemas/product.yml#/AddProduct"
    UpdateProduct:
      $ref: "./schemas/product.yml#/UpdateProduct"

    UpdateOrder:
      $ref: "./schemas/order.yml#/UpdateOrder"
    UpdateItemQuantity:
      $ref: "./schemas/order.yml#/UpdateItemQuantity"

    AddItemToCart:
      $ref: "./schemas/cart.yml#/AddItemToCart"

    CreateCoupon:
      $ref: "./schemas/coupon.yml#/CreateCoupon"

    Checkout:
      $ref: "./schemas/checkout.yml#/Checkout"

  responses:
    Unauthorized:
      $ref: "./responses/common.yml#/Unauthorized"
    Forbidden:
      $ref: "./responses/common.yml#/Forbidden"
    ValidationError:
      $ref: "./responses/common.yml#/ValidationError"
    ServerError:
      $ref: "./responses/common.yml#/ServerError"
    TooManyRequest:
      $ref: "./responses/common.yml#/TooManyRequest"
    AdminOnly:
      $ref: "./responses/common.yml#/AdminOnly"
    NotAllowed:
      $ref: "./responses/common.yml#/NotAllowed"

  parameters:
    ProductId:
      $ref: "./parameters/common.yml#/ProductId"
    OrderId:
      $ref: "./parameters/common.yml#/OrderId"
    OrderItemOrderId:
      $ref: "./parameters/common.yml#/OrderItemOrderId"
    ItemId:
      $ref: "./parameters/common.yml#/ItemId"
    CouponCode:
      $ref: "./parameters/common.yml#/CouponCode"
    Search:
      $ref: "./parameters/common.yml#/Search"
    Page:
      $ref: "./parameters/common.yml#/Page"
    Limit:
      $ref: "./parameters/common.yml#/Limit"
    MinPrice:
      $ref: "./parameters/common.yml#/MinPrice"
    MaxPrice:
      $ref: "./parameters/common.yml#/MaxPrice"
    Sort:
      $ref: "./parameters/common.yml#/Sort"

paths:
  /api/v1/users/register:
    $ref: "./paths/users.yml#/register"

  /api/v1/users/login:
    $ref: "./paths/users.yml#/login"

  /api/v1/users/refresh:
    $ref: "./paths/users.yml#/refresh"

  /api/v1/users/forgotpassword:
    $ref: "./paths/users.yml#/forgotpassword"

  /api/v1/users/resetpassword:
    $ref: "./paths/users.yml#/resetpassword"

  /api/v1/users/logout:
    $ref: "./paths/users.yml#/logout"

  /api/v1/users/me:
    $ref: "./paths/users.yml#/me"

  /api/v1/products:
    $ref: "./paths/products.yml#/products"

  /api/v1/products/{id}:
    $ref: "./paths/products.yml#/productById"
    
  /api/v1/orders/myorders:
    $ref: "./paths/orders.yml#/myOrders"

  /api/v1/orders/{id}:
    $ref: "./paths/orders.yml#/orderById"

  /api/v1/orders/{id}/cancel:
    $ref: "./paths/orders.yml#/cancelOrder"
    
  /api/v1/orders/items/order/{order_id}:
    $ref: "./paths/orderItems.yml#/orderItemsByOrderId"

  /api/v1/orders/items/{id}:
    $ref: "./paths/orderItems.yml#/orderItemById"

  /api/v1/cart:
    $ref: "./paths/cart.yml#/cart"

  /api/v1/cart/delete:
    $ref: "./paths/cart.yml#/deleteCart"

  /api/v1/cart/items:
    $ref: "./paths/cartItems.yml#/cartItems"

  /api/v1/cart/items/{id}:
    $ref: "./paths/cartItems.yml#/cartItemById"

  /api/v1/coupons:
    $ref: "./paths/coupons.yml#/coupons"

  /api/v1/coupons/{code}:
    $ref: "./paths/coupons.yml#/couponByCode"

  /api/v1/checkout:
    $ref: "./paths/checkout.yml#/checkout"